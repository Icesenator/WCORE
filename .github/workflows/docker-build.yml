name: Docker images

# P1-REL-CI-DOCKER-BUILD : aucun job ne construisait les images api et web. Le 13/11, l'image
# API ne se construisait plus (COPY packages/db/node_modules) et rien ne le signalait avant le
# deploiement. Ce workflow construit les deux images comme Railway : meme Dockerfile
# (wcore-web/railway/<service>.json), meme contexte (commit exporte, fichiers generes, liste
# .railwayignore appliquee, par ci-build-context.mjs). Aucun secret, aucun acces a Railway,
# aucune image poussee.

on:
  pull_request:
    # Tout ce que les Dockerfile copient (tsconfig.base.json, start-production.sh, sources...) peut
    # casser une image : wcore-web entier, hors documentation, plus wcore-gsheet/dist (@wcore/chains).
    # ci-build-context.test.mjs verifie que chaque source COPY des deux Dockerfile est couverte.
    paths:
      - 'wcore-web/**'
      - '!wcore-web/docs/**'
      - '!wcore-web/**/*.md'
      - 'wcore-gsheet/dist/**'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  # Apres chaque fusion, quel que soit le fichier : le signal arrive avant le deploiement.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            build_args: ''
          # Railway passe les variables du service comme arguments de build : le Dockerfile web
          # declare NEXT_PUBLIC_API_URL, que Next.js integre au bundle. Valeur de meme forme (URL
          # https publique) pour ne pas compiler avec une chaine vide ; elle n'est ni lue ni deployee.
          - service: web
            build_args: '--build-arg NEXT_PUBLIC_API_URL=https://api.example.com'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Railway upload context
        id: ctx
        run: |
          node wcore-web/scripts/ci-build-context.mjs --service "${{ matrix.service }}" --out "$RUNNER_TEMP/ctx" | tee "$RUNNER_TEMP/ctx.out"
          echo "dockerfile=$(sed -n 's/^DOCKERFILE=//p' "$RUNNER_TEMP/ctx.out")" >> "$GITHUB_OUTPUT"

      - name: docker build (no push)
        run: docker build --progress=plain ${{ matrix.build_args }} -f "$RUNNER_TEMP/ctx/${{ steps.ctx.outputs.dockerfile }}" -t "wcore-ci-${{ matrix.service }}" "$RUNNER_TEMP/ctx"
